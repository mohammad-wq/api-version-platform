<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const path = window.location.pathname;
        const route = path.match(/\/(?:login|projects|profile)(?:\/|$)/);
        const root = route
          ? path.slice(0, route.index + 1)
          : path.replace(/index\.html?$/i, "").replace(/[^/]*$/, "");
        const base = document.createElement("base");
        base.href = root || "/";
        document.head.appendChild(base);
      })();
      // Apply the colour theme before first paint (light unless the user chose otherwise; see src/theme.js).
      try {
        const theme = localStorage.getItem("avp.theme");
        if (theme !== "system") document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bea'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>API Version Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
