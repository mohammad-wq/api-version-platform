name: CI

on: [push, pull_request]

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php scripts/lint.php
      - run: php tests/parser_test.php
      - run: php tests/storage_test.php
      - run: php tests/publish_test.php
      - run: php tests/tester_test.php

  # The hosted web backend runs PHP 7.4: the parser must keep working there.
  php74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Syntax-check the parser files on PHP 7.4
        run: |
          for f in src/Parser/*.php src/MarkdownOpenApiParser.php src/autoload.php scripts/hosted/polyfills.php; do php -l "$f"; done
      - run: php tests/hosted_smoke_test.php

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test src/lib
      - run: npm run build:package
